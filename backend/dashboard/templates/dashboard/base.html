<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Smart Appointment Scheduler{% endblock %}</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --surface: #ffffff;
        --surface-alt: #f2efe9;
        --ink: #1d1b1a;
        --muted: #655f59;
        --border: #e7dfd6;
        --primary: #4f46e5;
        --primary-soft: #eef0ff;
        --success: #0f7b53;
        --shadow: 0 20px 40px rgba(22, 18, 17, 0.08);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #f5f2ee 0%, #faf8f5 100%);
        color: var(--ink);
      }
      a { color: inherit; text-decoration: none; }
      .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(18px);
        background: rgba(255,255,255,0.78);
        border-bottom: 1px solid rgba(231,223,214,0.8);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        font-weight: 700;
        letter-spacing: -0.03em;
        font-size: 1.2rem;
      }
      .brand-mark {
        width: 10px; height: 10px; border-radius: 50%;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        margin-right: 12px;
        box-shadow: 0 0 0 8px rgba(79, 70, 229, 0.12);
      }
      .nav-links {
        display: flex; align-items: center; gap: 24px; color: var(--muted); font-size: 0.96rem;
      }
      .cta {
        display: inline-flex; align-items: center; justify-content: center;
        border: none; background: var(--primary); color: #fff; border-radius: 14px;
        padding: 12px 18px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 20px rgba(79,70,229,0.24);
      }
      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow);
      }
      .hero {
        padding: 72px 0 36px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.3fr 0.9fr;
        gap: 28px;
        align-items: center;
      }
      .eyebrow {
        display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--primary-soft);
        color: var(--primary); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      }
      h1 {
        font-size: clamp(2.5rem, 4vw, 4.4rem);
        line-height: 1.02;
        margin: 18px 0 18px;
        letter-spacing: -0.06em;
      }
      p {
        margin: 0; color: var(--muted); font-size: 1.02rem; line-height: 1.7;
      }
      .hero-actions { display: flex; gap: 14px; margin-top: 28px; }
      .secondary {
        display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); font-weight: 600;
      }
      .stat-card {
        padding: 20px; border-radius: 24px; border: 1px solid var(--border); background: var(--surface);
      }
      .stat-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px;
      }
      .stat-grid strong { display: block; font-size: 1.7rem; letter-spacing: -0.05em; }
      .section { padding: 24px 0 60px; }
      .section-head {
        display: flex; align-items: end; justify-content: space-between; margin-bottom: 18px;
      }
      .service-grid, .staff-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;
      }
      .service-item, .staff-item {
        padding: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
      }
      .service-item h3, .staff-item h3 { margin: 0 0 8px; font-size: 1.2rem; }
      .chip {
        display: inline-flex; padding: 6px 10px; background: var(--primary-soft); color: var(--primary); border-radius: 999px; font-size: 0.75rem; font-weight: 700;
      }
      .booking-shell {
        display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 28px; align-items: start;
      }
      .panel {
        background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 24px;
      }
      .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
      label { font-weight: 600; color: var(--ink); }
      input, select, button {
        font: inherit;
      }
      input, select {
        width: 100%; border: 1px solid var(--border); background: #fff; color: var(--ink); border-radius: 14px; padding: 12px 14px; outline: none;
      }
      .slot-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-top: 12px;
      }
      .slot {
        display: block; padding: 12px 8px; text-align: center; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-alt); font-weight: 600; cursor: pointer;
      }
      .slot input { display: none; }
      .slot.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
      .alert {
        padding: 12px 14px; background: #fff0f0; border: 1px solid #f0c7c7; color: #8a2f2f; border-radius: 12px; margin-bottom: 18px;
      }
      .success-box {
        padding: 28px; border-radius: 24px; border: 1px solid #d9eddc; background: #f0faf2; color: #1c5d3d;
      }
      .list { list-style: none; padding-left: 0; margin: 20px 0 0; }
      .list li { margin-bottom: 10px; }
      .muted { color: var(--muted); }
      @media (max-width: 840px) {
        .hero-grid, .booking-shell { grid-template-columns: 1fr; }
        .nav-links { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a href="/" class="brand"><span class="brand-mark"></span> Smart Appointment Scheduler</a>
        <nav class="nav-links">
          <a href="/">Home</a>
          <a href="/book/">Book now</a>
          <a href="/api/healthz/">API health</a>
        </nav>
        <a href="/book/" class="cta">Book an appointment</a>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
